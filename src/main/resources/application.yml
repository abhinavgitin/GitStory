server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: github-analytics
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mongodb:
    uri: ${MONGODB_URI}
    database: github-analytics
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: github-analytics
      auto-index-creation: true

github:
  token: ${GITHUB_TOKEN}
  base-url: https://api.github.com
  connect-timeout-seconds: 5
  read-timeout-seconds: 20
  search-page-size: 100
  search-max-pages: 3

refresh:
  secret: ${REFRESH_SECRET}

app:
  timezone: Asia/Kolkata
  refresh:
    cooldown-minutes: 15
    overall-timeout-seconds: 180
  limits:
    max-repos-per-user: 50
    commit-history-months: 12
    max-concurrent-refreshes: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
