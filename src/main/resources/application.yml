spring:
  application:
    name: github-analytics
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGODB_URI}
    database: github-analytics
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: github-analytics

github:
  token: ${GITHUB_TOKEN}
  base-url: https://api.github.com

refresh:
  secret: ${REFRESH_SECRET}

app:
  timezone: Asia/Kolkata
  refresh:
    cooldown-minutes: 15
  limits:
    max-repos-per-user: 50
    commit-history-months: 12
    max-concurrent-refreshes: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
